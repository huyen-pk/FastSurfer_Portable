[package]
name = "FastSurfer_Desktop"
version = "0.1.0"
description = "FastSurfer Desktop A Tauri App"
authors = ["FastSurfer authors", "huyenpk and community"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fastsurfer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-process = "2.3.1"
candle = { package = "candle-core", version = "0.9.2" }
candle-onnx = "0.9.2"
nifti = { version = "0.17", features = ["ndarray_volumes"] }
ndarray = "0.16"
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }

[patch.crates-io]
candle-onnx = { path = "vendor/candle-onnx" }

[dev-dependencies]
criterion = "0.5"
libc = "0.2"

[[bench]]
name = "candle_inference_bench"
harness = false

[profile.test]
opt-level = 3
